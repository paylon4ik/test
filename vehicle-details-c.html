<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Van 14 – Vehicle details</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: var(--font-family);
      background: var(--color-background);
      color: var(--color-text);
      line-height: 1.5;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 400px;
      height: 100vh;
    }

    /* Map */

    .map {
      position: relative;
      overflow: hidden;
      background: var(--color-map-land);
    }

    .map svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .map-label {
      font-family: var(--font-family);
      font-size: var(--font-size-md);
      font-weight: 600;
      fill: var(--color-text-muted);
    }

    .marker-halo { fill: var(--color-primary); opacity: 0.18; }
    .marker-dot { fill: var(--color-primary); stroke: var(--color-surface); stroke-width: 5; }
    .marker-tag rect { fill: var(--color-surface); stroke: var(--color-border); }
    .marker-tag text {
      font-family: var(--font-family);
      font-size: var(--font-size-md);
      font-weight: 600;
      fill: var(--color-text);
    }

    .map-controls {
      position: absolute;
      right: var(--space-16);
      bottom: var(--space-16);
      display: flex;
      flex-direction: column;
      gap: var(--space-8);
    }

    .map-control {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      font: inherit;
      font-size: var(--font-size-lg);
      line-height: 1;
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: 0 1px 4px var(--color-shadow);
    }

    .map-control:hover { border-color: var(--color-text-muted); }

    .map-back {
      position: absolute;
      left: var(--space-16);
      top: var(--space-16);
      display: inline-flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-8) var(--space-12);
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: var(--font-size-sm);
      text-decoration: none;
      box-shadow: 0 1px 4px var(--color-shadow);
    }

    .map-back:hover { border-color: var(--color-text-muted); }

    /* Side panel */

    .panel {
      background: var(--color-surface);
      border-left: 1px solid var(--color-border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: var(--space-24) var(--space-24) var(--space-16);
      border-bottom: 1px solid var(--color-border);
    }

    .panel-header h1 {
      font-size: var(--font-size-xl);
      margin: 0 0 var(--space-4);
    }

    .plate {
      display: inline-block;
      font-family: var(--font-family-mono);
      font-size: var(--font-size-sm);
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: var(--space-4) var(--space-8);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-background);
    }

    .header-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-8);
      margin-top: var(--space-8);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-8);
      border-radius: var(--radius-full);
      font-size: var(--font-size-sm);
      font-weight: 600;
      background: var(--color-success-bg);
      color: var(--color-success);
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-success);
    }

    .details {
      margin: 0;
      padding: var(--space-8) var(--space-24);
    }

    .detail {
      padding: var(--space-12) 0;
      border-bottom: 1px solid var(--color-border);
    }

    .detail:last-child { border-bottom: 0; }

    .detail dt {
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--space-4);
    }

    .detail dd {
      margin: 0;
      font-weight: 600;
    }

    .detail .sub {
      display: block;
      font-weight: 400;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
    }

    .panel-actions {
      margin-top: auto;
      padding: var(--space-16) var(--space-24) var(--space-24);
      display: flex;
      gap: var(--space-8);
      border-top: 1px solid var(--color-border);
    }

    .button-primary,
    .button-secondary {
      flex: 1;
      font: inherit;
      font-weight: 600;
      padding: var(--space-8) var(--space-16);
      border-radius: var(--radius-md);
      white-space: nowrap;
      cursor: pointer;
    }

    .button-primary {
      border: 0;
      background: var(--color-primary);
      color: var(--color-on-primary);
    }

    .button-primary:hover { background: var(--color-primary-hover); }

    .button-secondary {
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
    }

    .button-secondary:hover { border-color: var(--color-text-muted); }

    .button-primary:focus-visible,
    .button-secondary:focus-visible,
    .map-control:focus-visible,
    .map-back:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 3px;
    }

    /* Narrow screens: map on top, panel below */

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: 55vh auto;
        height: auto;
      }

      .panel {
        border-left: 0;
        border-top: 1px solid var(--color-border);
        overflow: visible;
      }

      .details,
      .panel-header,
      .panel-actions {
        padding-left: var(--space-16);
        padding-right: var(--space-16);
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <section class="map" aria-label="Map showing the vehicle's current location">
      <svg viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <!-- Water -->
        <path d="M0 640 C 180 600, 320 700, 520 660 S 860 600, 1000 650 L 1000 800 L 0 800 Z" fill="var(--color-map-water)"/>
        <!-- Parks and blocks -->
        <rect x="80" y="90" width="190" height="140" rx="10" fill="var(--color-map-park)"/>
        <rect x="330" y="90" width="160" height="140" rx="6" fill="var(--color-map-block)"/>
        <rect x="560" y="90" width="170" height="140" rx="6" fill="var(--color-map-block)"/>
        <rect x="790" y="90" width="170" height="140" rx="6" fill="var(--color-map-block)"/>
        <rect x="80" y="300" width="190" height="200" rx="6" fill="var(--color-map-block)"/>
        <rect x="330" y="300" width="160" height="200" rx="6" fill="var(--color-map-block)"/>
        <rect x="790" y="300" width="170" height="200" rx="10" fill="var(--color-map-park)"/>
        <rect x="660" y="430" width="80" height="80" rx="6" fill="var(--color-map-block)"/>
        <!-- Roads -->
        <g stroke="var(--color-map-road-edge)" stroke-width="30" fill="none" stroke-linecap="round">
          <path d="M0 265 H1000"/>
          <path d="M0 545 C 300 545, 600 560, 1000 560"/>
          <path d="M300 0 V560"/>
          <path d="M760 0 V560"/>
          <path d="M525 0 V265 L 580 368 L 760 368"/>
        </g>
        <g stroke="var(--color-map-road)" stroke-width="24" fill="none" stroke-linecap="round">
          <path d="M0 265 H1000"/>
          <path d="M0 545 C 300 545, 600 560, 1000 560"/>
          <path d="M300 0 V560"/>
          <path d="M760 0 V560"/>
          <path d="M525 0 V265 L 580 368 L 760 368"/>
        </g>
        <!-- Route travelled -->
        <path d="M300 545 V265 H525 L 580 368" stroke="var(--color-primary)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 12" opacity="0.8"/>
        <!-- Labels -->
        <text class="map-label" x="175" y="165" text-anchor="middle">Riverside Park</text>
        <text class="map-label" x="200" y="290" text-anchor="middle">Harbor Rd</text>
        <text class="map-label" x="520" y="730" text-anchor="middle">Port Basin</text>
        <!-- Vehicle -->
        <circle class="marker-halo" cx="580" cy="368" r="28"/>
        <circle class="marker-dot" cx="580" cy="368" r="12"/>
        <g class="marker-tag">
          <rect x="540" y="306" width="80" height="30" rx="6"/>
          <text x="580" y="327" text-anchor="middle">Van 14</text>
        </g>
      </svg>


      <a class="map-back" href="vehicles.html">&larr; Back to vehicles</a>

      <div class="map-controls">
        <button type="button" class="map-control" aria-label="Zoom in">+</button>
        <button type="button" class="map-control" aria-label="Zoom out">&minus;</button>
        <button type="button" class="map-control" aria-label="Center on vehicle">&#9678;</button>
      </div>
    </section>

    <aside class="panel" aria-labelledby="vehicle-name">
      <header class="panel-header">
        <h1 id="vehicle-name">Van 14</h1>
        <div class="header-meta">
          <span class="plate" aria-label="Plate number">KX 482 TR</span>
          <span class="status">On trip</span>
        </div>
      </header>

      <dl class="details">
        <div class="detail">
          <dt>Driver</dt>
          <dd>Maria Lopez<span class="sub">+1 555 0142</span></dd>
        </div>
        <div class="detail">
          <dt>Location</dt>
          <dd>Harbor Rd and Dock St<span class="sub">Updated 2 min ago</span></dd>
        </div>
        <div class="detail">
          <dt>Last service</dt>
          <dd>12 Aug 2026<span class="sub">3,420 km ago · next due at 90,000 km</span></dd>
        </div>
        <div class="detail">
          <dt>Mileage</dt>
          <dd>84,210 km</dd>
        </div>
      </dl>

      <div class="panel-actions">
        <button type="button" class="button-secondary">Schedule service</button>
        <button type="button" class="button-primary">Contact driver</button>
      </div>
    </aside>
  </div>
</body>
</html>
