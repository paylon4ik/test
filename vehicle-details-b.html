<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicle details</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-family);
      background: var(--color-background);
      color: var(--color-text);
      line-height: 1.5;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--space-32) var(--space-16);
    }

    .page-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-16);
      margin: 0 0 var(--space-24);
    }

    h1 {
      font-size: var(--font-size-xl);
      margin: 0;
    }

    .plate {
      display: inline-block;
      margin-top: var(--space-4);
      padding: var(--space-4) var(--space-8);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      font-family: var(--font-family-mono);
      font-size: var(--font-size-md);
      letter-spacing: 0.06em;
    }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-16) var(--space-24);
    }

    .status-card {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-16) var(--space-24);
      margin: 0 0 var(--space-16);
      border-left: 6px solid var(--color-success);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-8);
      padding: var(--space-4) var(--space-12);
      border-radius: var(--radius-full);
      background: var(--color-success-bg);
      color: var(--color-success);
      font-weight: 700;
      font-size: var(--font-size-lg);
    }

    .status-badge::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-card p {
      margin: 0;
      color: var(--color-text-muted);
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--space-16);
      margin: 0;
    }

    .detail-grid .card { margin: 0; }

    .detail-grid dt {
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      margin: 0 0 var(--space-4);
    }

    .detail-grid dd {
      margin: 0;
      font-size: var(--font-size-lg);
      font-weight: 600;
    }

    .detail-grid .meta {
      display: block;
      margin-top: var(--space-4);
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      font-weight: 400;
    }

    .button-primary {
      display: inline-block;
      font: inherit;
      font-weight: 600;
      padding: var(--space-8) var(--space-16);
      border: 0;
      border-radius: var(--radius-md);
      background: var(--color-primary);
      color: var(--color-on-primary);
      cursor: pointer;
    }

    .button-primary:hover { background: var(--color-primary-hover); }

    .button-primary:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <h1>Ford Transit 14</h1>
        <span class="plate" aria-label="Plate number">KX21 BTD</span>
      </div>
      <button type="button" class="button-primary">Edit vehicle</button>
    </header>

    <section class="card status-card" aria-label="Status">
      <span class="status-badge">Active</span>
      <p>On a delivery route since 08:15 today.</p>
    </section>

    <dl class="detail-grid">
      <div class="card">
        <dt>Driver</dt>
        <dd>Maria Lopez<span class="meta">Assigned 12 Oct 2026</span></dd>
      </div>
      <div class="card">
        <dt>Location</dt>
        <dd>Leeds, Kirkstall Rd<span class="meta">Updated 5 min ago</span></dd>
      </div>
      <div class="card">
        <dt>Last service</dt>
        <dd>3 Sep 2026<span class="meta">Next due 3 Mar 2027</span></dd>
      </div>
      <div class="card">
        <dt>Mileage</dt>
        <dd>48,215 mi<span class="meta">+312 mi this week</span></dd>
      </div>
    </dl>
  </main>
</body>
</html>
