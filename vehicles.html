<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicles</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-family);
      background: var(--color-background);
      color: var(--color-text);
      line-height: 1.5;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--space-32) var(--space-16);
    }

    h1 {
      font-size: var(--font-size-xl);
      margin: 0 0 var(--space-24);
    }

    .empty-state {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: calc(var(--space-32) + var(--space-24)) var(--space-24);
      text-align: center;
    }

    .empty-state h2 {
      font-size: var(--font-size-lg);
      margin: 0 0 var(--space-8);
    }

    .empty-state p {
      color: var(--color-text-muted);
      margin: 0 auto var(--space-24);
      max-width: 36ch;
    }

    .button-primary {
      display: inline-block;
      font: inherit;
      font-weight: 600;
      padding: var(--space-8) var(--space-16);
      border: 0;
      border-radius: var(--radius-md);
      background: var(--color-primary);
      color: var(--color-on-primary);
      cursor: pointer;
    }

    .button-primary:hover { background: var(--color-primary-hover); }

    .button-primary:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Vehicles</h1>
    <section class="empty-state" aria-labelledby="empty-title">
      <h2 id="empty-title">No vehicles added</h2>
      <p>Try changing or resetting your filters to see more vehicles.</p>
      <button type="button" class="button-primary">Reset filters</button>
    </section>
  </main>
</body>
</html>
