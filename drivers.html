<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drivers</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #e3e6ea;
      --text: #1b1f24;
      --muted: #5b6470;
      --primary: #2459d6;
      --primary-hover: #1c48b0;
      --on-primary: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --surface: #1a1e24;
        --border: #2b3139;
        --text: #eef1f4;
        --muted: #a2abb6;
        --primary: #5b8cff;
        --primary-hover: #7aa2ff;
        --on-primary: #0b1020;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 24px;
    }

    .empty-state {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 56px 24px;
      text-align: center;
    }

    .empty-state h2 {
      font-size: 1.0625rem;
      margin: 0 0 8px;
    }

    .empty-state p {
      color: var(--muted);
      margin: 0 auto 24px;
      max-width: 36ch;
    }

    .button-primary {
      display: inline-block;
      font: inherit;
      font-weight: 600;
      padding: 10px 20px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: var(--on-primary);
      cursor: pointer;
    }

    .button-primary:hover { background: var(--primary-hover); }

    .button-primary:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Drivers</h1>
    <section class="empty-state" aria-labelledby="empty-title">
      <h2 id="empty-title">No drivers yet</h2>
      <p>Add your first driver to assign vehicles and track trips.</p>
      <button type="button" class="button-primary">Add driver</button>
    </section>
  </main>
</body>
</html>
